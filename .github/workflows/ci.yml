# CI — outer-loop quality gate (Phase 8, written in the "CI-ready foundation" step).
#
# Jobs: quality (ruff + shellcheck) → test (pytest unit tests) → build (Docker image).
# A Floci-backed integration-test job will be added once the ImageFlow pipeline
# endpoints exist. Runs on push to main and on every pull request.
#
# NOTE: this repo has no GitHub remote yet — the workflow is validated locally
# with `act`. On Apple Silicon, run act NATIVE arm64 and do NOT force
# `--container-architecture linux/amd64` (QEMU emulation segfaults the ruff
# binary — a local emulation artifact only; ruff is native on GitHub runners).
# It goes live automatically the moment the repo is pushed to GitHub.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write   # required by buildx's gha cache backend (restore + save)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt

      - name: Ruff lint
        run: ruff check app/ lambda/image-processor/

      - name: Install shellcheck (pinned to match local brew 0.11.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -q https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Shellcheck scripts
        run: scripts/lint.sh

      - name: Validate pyproject.toml
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb')); print('pyproject.toml OK')"

      - name: Validate Terraform (dev environment)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform init (no backend) + validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt

      - name: Run pytest
        run: pytest -q

  security:
    name: Security gates (Phase 14)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      # gitleaks scans commit ranges (base^..head) — it needs the full history,
      # so this job must NOT use the default shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit — dependency CVEs
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt -r lambda/image-processor/requirements.txt

      - name: gitleaks — secrets in git history/tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          # Keep the scan fast and noise-free: skip the local venv and runtime
          # artifacts (mirrors scripts/security-audit.sh exclusions).
          skip-dirs: .venv,data

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # load: true — the trivy image scan in the next step needs the image
          # in the local daemon; the default buildx docker-container driver
          # does not export it there otherwise (load defaults to false).
          load: true
          tags: imageflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || github.run_id }}

      - name: Trivy — image vulnerability scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: imageflow-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
