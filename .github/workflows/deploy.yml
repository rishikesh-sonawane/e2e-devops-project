# deploy.yml — outer-loop CD (ADR-05, inner/outer dual loop)
#
# Triggered on push to main (after CI). Mirrors what CodeBuild does natively,
# so the two loops are comparable:
#   1. gate   — ruff + shellcheck (same quality job as CI)
#   2. test   — pytest (same as CI)
#   3. deploy — push the API image to Floci ECR (:5100), then trigger the
#               CodePipeline inner loop (S3 source → CodeBuild → CodeDeploy)
#
# Floci-aware: every AWS call targets http://localhost:4566 with dummy creds.
# On a real GitHub runner these steps would target real AWS (same code shape).

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", ".ai_memory/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - name: Ruff lint
        run: ruff check app/ lambda/image-processor/
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -q https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          scripts/lint.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - name: Run pytest
        run: pytest -q

  deploy:
    name: Push image + trigger inner loop
    runs-on: ubuntu-latest
    needs: [gate, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push API image to Floci ECR
        run: |
          # Local Floci targets: registry on :5100, API on :4566.
          # Set IMAGEFLOW_ECR_URI to a real registry on GitHub runners.
          ECR="${IMAGEFLOW_ECR_URI:-host.docker.internal:5100/imageflow-api}"
          docker build -t "${ECR}:latest" \
            --build-arg GIT_SHA=${GITHUB_SHA} \
            --build-arg BUILD_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ) .
          docker tag "${ECR}:latest" "${ECR}:${GITHUB_SHA::7}"
          docker push "${ECR}:latest"
          docker push "${ECR}:${GITHUB_SHA::7}"

      - name: Upload source + trigger CodePipeline inner loop
        run: |
          python -m pip install -q boto3
          python - <<'PY'
          import boto3, json, sys
          ep = "http://localhost:4566"
          kw = dict(endpoint_url=ep, region_name="us-east-1",
                    aws_access_key_id="test", aws_secret_access_key="test")
          s3 = boto3.client("s3", **kw)
          cp = boto3.client("codepipeline", **kw)
          # The Source stage reads s3://imageflow-artifacts/source.zip — upload
          # the current commit first so the pipeline builds THIS revision, not
          # whatever was last uploaded manually.
          import subprocess, tempfile
          with tempfile.NamedTemporaryFile(suffix=".zip") as f:
              subprocess.run(["git", "archive", "--format=zip", "-o", f.name, "HEAD"], check=True)
              s3.upload_file(f.name, "imageflow-artifacts", "source.zip")
          r = cp.start_pipeline_execution(name="imageflow-pipeline")
          print("pipeline execution:", r.get("pipelineExecutionId"))
          PY
