name: docs-site

# Builds docs/ with MkDocs (Material theme) and deploys to GitHub Pages.
# The site is the browsable documentation portal: sidebar nav, search, dark mode.
# Live at https://rishikesh-sonawane.github.io/e2e-devops-project/

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs (pinned)
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
