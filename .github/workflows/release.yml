# release.yml — tagged release pipeline (ADR-05, outer loop)
#
# On a vX.Y.Z tag:
#   1. Runs the full gate (ruff + shellcheck + pytest)
#   2. Builds the API image; pushes to the registry (tagged vX.Y.Z AND latest)
#      ONLY when a Floci-connected registry is reachable
#   3. Runs terraform validate (IaC is part of the release artifact)
#   4. Creates the GitHub Release
#
# Floci-aware: registry + AWS API target localhost with dummy creds. Real
# registries/AWS work with the same shape (set IMAGEFLOW_ECR_URI / AWS_*).
# The image push targets the local Floci registry, which does not exist on
# plain GitHub runners — it is gated behind the IMAGEFLOW_RUN_DEPLOY repo var
# (same convention as deploy.yml), so a tag push on GitHub runs the gates,
# build, IaC validation, and release creation, and skips the push.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - run: ruff check app/ lambda/image-processor/
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -q https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          scripts/lint.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - run: pytest -q

  release:
    name: Build, push, validate IaC
    runs-on: ubuntu-latest
    needs: [gate, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive version
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      - name: Build + tag image
        run: |
          ECR="${IMAGEFLOW_ECR_URI:-host.docker.internal:5100/imageflow-api}"
          VERSION="${{ steps.version.outputs.version }}"
          docker build -t "${ECR}:${VERSION}" \
            --build-arg GIT_SHA=${GITHUB_SHA} \
            --build-arg BUILD_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ) .
          docker tag "${ECR}:${VERSION}" "${ECR}:latest"

      - name: Push image to registry (Floci-connected runner only)
        if: ${{ vars.IMAGEFLOW_RUN_DEPLOY == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          ECR="${IMAGEFLOW_ECR_URI:-host.docker.internal:5100/imageflow-api}"
          VERSION="${{ steps.version.outputs.version }}"
          docker push "${ECR}:${VERSION}"
          docker push "${ECR}:latest"

      - name: Validate Terraform (dev environment)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform init (no backend) + validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ImageFlow ${{ steps.version.outputs.version }}
          body: |
            ## ImageFlow ${{ steps.version.outputs.version }} 🚀

            First stable release of the **DevOps Operating System** — a production-inspired image pipeline
            (FastAPI + S3 + Lambda + DynamoDB + SNS) wrapped in the full platform-engineering surface,
            built and verified end-to-end on Floci for **$0**.

            ### What's in v1
            - **App** — FastAPI image pipeline: upload → S3 → Lambda (Pillow) → PROCESSED + SNS
            - **IaC** — Terraform: 7 modules, remote state + locking, idempotent plans
            - **Kubernetes** — real k3s + Helm chart, HPA, rolling/rollback/canary/blue-green proven live
            - **CI/CD** — dual loop: GitHub Actions (outer) + CodePipeline→CodeBuild→CodeDeploy (inner)
            - **Observability** — Prometheus /metrics + CloudWatch metrics/logs/alarms + alerting
            - **Security** — KMS, Secrets Manager, Cognito JWTs, WAF v2, least-privilege IAM, CI gates
            - **Reliability** — measured RTO drills, chaos injection, auto-scaling reconcilers
            - **Docs** — GitHub Pages site, architecture, runbook, developer guide, 15-phase roadmap
          generate_release_notes: true
