# release.yml — tagged release pipeline (ADR-05, outer loop)
#
# On a vX.Y.Z tag:
#   1. Runs the full gate (ruff + shellcheck + pytest)
#   2. Builds + pushes the API image to the registry tagged vX.Y.Z AND latest
#   3. Runs terraform validate (IaC is part of the release artifact)
#
# Floci-aware: registry + AWS API target localhost with dummy creds. Real
# registries/AWS work with the same shape (set IMAGEFLOW_ECR_URI / AWS_*).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - run: ruff check app/ lambda/image-processor/
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -q https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          scripts/lint.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt -r lambda/image-processor/requirements.txt
      - run: pytest -q

  release:
    name: Build, push, validate IaC
    runs-on: ubuntu-latest
    needs: [gate, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive version
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      - name: Build + push image (tag + latest)
        run: |
          ECR="${IMAGEFLOW_ECR_URI:-host.docker.internal:5100/imageflow-api}"
          VERSION="${{ steps.version.outputs.version }}"
          docker build -t "${ECR}:${VERSION}" \
            --build-arg GIT_SHA=${GITHUB_SHA} \
            --build-arg BUILD_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ) .
          docker tag "${ECR}:${VERSION}" "${ECR}:latest"
          docker push "${ECR}:${VERSION}"
          docker push "${ECR}:latest"

      - name: Validate Terraform (dev environment)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform init (no backend) + validate
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ImageFlow ${{ steps.version.outputs.version }}
          body: |
            Automated release built and pushed by the outer-loop CD.
            Image: `imageflow-api:${{ steps.version.outputs.version }}`
          generate_release_notes: true
