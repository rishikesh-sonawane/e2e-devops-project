# canary.yaml — Canary release demo (Phase 12)
#
# The stable Deployment (helm-managed "imageflow", image v2) already exists with
# 3 replicas and the selector labels below. The canary Deployment carries the
# SAME two selector labels (app.kubernetes.io/name + instance) so the existing
# Service routes a share of live traffic to it proportional to replica count —
# a real canary: small slice first, then progress to full rollout.
#
#   1. kubectl apply -f k8s/demo/canary.yaml     (canary v3, 1 replica ≈ 25% traffic)
#   2. curl the service repeatedly → responses mix git_sha=v2 and git_sha=v3
#   3. kubectl scale deploy imageflow-canary --replicas=3  (≈ 50/50)
#   4. Observe metrics/version split, then promote (set stable to v3) or
#      abandon (scale canary to 0).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imageflow-canary
  labels:
    app.kubernetes.io/name: imageflow
    app.kubernetes.io/instance: imageflow
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: imageflow
      app.kubernetes.io/instance: imageflow
      track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imageflow
        app.kubernetes.io/instance: imageflow
        track: canary
    spec:
      containers:
        - name: imageflow
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/imageflow-api:v3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GIT_SHA
              value: "v3"   # visible in /version — proves canary traffic split
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
